    Georgia Tech, Centre de Recherches sur la Cognition Animale, Baylor College of
    Medicine.'
- years: 2024 - 2026
  description: 'ANR SAPS-RA-AI - (CoCerACoCo) Connaitre le cerveau des animaux pour
    mieux comprendre leurs comportements. 150k€. Coordination: E. Chaillou, Partenaires
    : Université d’Angers (LARIS), Université d’Orléans (ERCAE), Université de Tours
    (LIFAT), Université Savoie-Mont-Blanc (LISTIC), INSERM (iBrain), CEA (NeuroSpin),
    Zooparc de Beauval, Beauval Nature.'
