  description: 'Crédits Incitatifs PHASE-INRAE. Functional MRI of the sheep auditory
    cortex. 20k€. Coordination : S. Love. Partenaires : UMR PRC.'
- years: 2018 - 2022
  description: 'Projet d’intérêt regional – (Neuro2Co) Neurobiologie des comportements
    des animaux, démarche de sciences participatives au collège. 210k€ of which 200k€
