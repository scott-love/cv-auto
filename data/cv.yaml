funding:
  - years: "2024 - 2026"
    description: >-
      American NIH - Towards High-Resolution Neuro-Behavioral Quantification of Sheep in the Field to Study Complex Social Behaviors. 685k. Coordination : C. Kemere, Partenaires : INRAE (PRC – Coordination : S. Love), Rice University, Georgia Tech, Centre de Recherches sur la Cognition Animale, Baylor College of Medicine.

  - years: "2024 - 2026"
    description: >-
      ANR SAPS-RA-AI - (CoCerACoCo) Connaitre le cerveau des animaux pour mieux comprendre leurs comportements. 150k€. Coordination: E. Chaillou, Partenaires : Université d’Angers (LARIS), Université d’Orléans (ERCAE), Université de Tours (LIFAT), Université Savoie-Mont-Blanc (LISTIC), INSERM (iBrain), CEA (NeuroSpin), Zooparc de Beauval, Beauval Nature.

  - years: "2021 - 2024"
    description: >-
      ANR JCJC – (SheepVoicefMRI) Neuroimagerie fonctionnelle des mécanismes de la perception des voix chez le mouton. 200k€. Coordination : S. Love. Partenaires : UMR PRC.

  - years: "2020 - 2021"
    description: >-
      Crédits Incitatifs PHASE-INRAE. Functional MRI of the sheep auditory cortex. 20k€. Coordination : S. Love. Partenaires : UMR PRC.

  - years: "2018 - 2022"
    description: >-
      Projet d’intérêt regional – (Neuro2Co) Neurobiologie des comportements des animaux, démarche de sciences participatives au collège. 210k€ of which 200k€ dedicated to research. Coordination : E. Chaillou. Partenaires « recherche » : UMR PRC, iBrain (Inserm), LIFAT (Univ. Tours), NeuroSpin (CEA), ZooParc de Beauval et Beauval Nature.



